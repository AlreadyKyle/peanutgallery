[build]
  command = "pnpm --filter @backseat/site build"
  publish = "dist"
  # A card/* branch never builds: its pull request is opened before the gate runs, so a deploy
  # preview would publish ungated card code. A dependabot/* branch builds no preview either: each
  # lockfile pull request would build both sites against the team's build minutes, and main builds
  # after the merge. Every other pull request still gets its preview. Otherwise skip the build only
  # when a previous successful build exists, differs, and touched nothing this site's build reads:
  # this folder and the workspace files (docs/specs/scale-launch.md).
  ignore = 'case "$HEAD" in card/*|dependabot/*) exit 0 ;; esac; test -n "$CACHED_COMMIT_REF" && test "$CACHED_COMMIT_REF" != "$COMMIT_REF" && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../../pnpm-lock.yaml ../../package.json ../../pnpm-workspace.yaml ../../tsconfig.base.json'

[build.environment]
  NODE_VERSION = "22"
  # Public values only. Secrets never go here.
  VITE_STRIPE_PAYMENT_LINK_URL = "https://buy.stripe.com/dRm28s4ie0zp6BU0qEafS01"
  VITE_DISCORD_INVITE = "https://discord.gg/rwkbWhMk8r"
  VITE_PLAY_URL = "https://play.mobmachine.games"

# The site's one Netlify Function (docs/specs/site-snapshot.md): /api/live and /api/cards, the two
# documents every figure on the site comes from, read from Supabase with the publishable key in
# netlify/lib/public-env.ts and cached by the CDN. The page itself holds no Supabase client.
[functions]
  directory = "netlify/functions"

# The netlify.app address and the old domain always forward to the studio's own domain, same path
# (docs/specs/rename.md). peanutgallery.games stays registered and a domain alias of this site.
[[redirects]]
  from = "https://peanutgallerygames.netlify.app/*"
  to = "https://mobmachine.games/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://peanutgallery.games/*"
  to = "https://mobmachine.games/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.peanutgallery.games/*"
  to = "https://mobmachine.games/:splat"
  status = 301
  force = true

# The board has its own site (docs/specs/board-site.md). /board here is a plain not found page, served
# with a 404 status, and nothing on this site names the board's address.
[[redirects]]
  from = "/board"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/board/*"
  to = "/index.html"
  status = 404
  force = true

# The Contribute, Ledger and legal pages are the app's, from kernel code (docs/specs/board-site.md).
# force serves the app at these paths even when the build holds a file there, so a page a card adds to
# public/ (ledger.html, contribute/index.html) can never stand in for one of them. Each posted Terms
# and Refunds version has its own page under /terms/ and /refunds/ (docs/specs/legal-copy.md).
[[redirects]]
  from = "/contribute"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/ledger"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/terms"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/terms/*"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/refunds"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/refunds/*"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/contact"
  to = "/index.html"
  status = 200
  force = true

# /thanks is where Stripe's redirect lands after a payment (docs/specs/supporter-pages.md): the app's,
# from kernel code, whatever the build holds at that path.
[[redirects]]
  from = "/thanks"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers on every path, the SPA rewrite included (docs/specs/site-truth-pass.md).
# The whole policy is enforced: the script, the stylesheet, the fonts and every image are same-origin
# (img-src also allows data:). The page may connect only to itself, so script on this origin cannot
# send data anywhere else (docs/specs/launch-site.md) nor reach the database (docs/specs/site-snapshot.md:
# its figures come from /api on this origin), and no form on it may post anywhere but here
# (docs/specs/board-site.md). It does not stop a link to another host: the gate's payment-host scan
# fails a build that carries a payment address other than the Payment Link above.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Vite names every file under /assets by a hash of its contents, so a new build never reuses a name
# and each file can be kept for a year without a revalidation (docs/specs/site-snapshot.md).
# index.html, /version.json and /fonts/* keep Netlify's default, which revalidates on every view.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The unlisted design guide (docs/specs/design-system.md) shows sample figures, so it asks search
# engines not to index it in the response itself, not only in the meta tag the page adds once it
# runs. Netlify adds these to the headers above for this path.
[[headers]]
  for = "/design-kit-7q4m"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
