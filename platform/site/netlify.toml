[build]
  command = "pnpm --filter @backseat/site build"
  publish = "dist"
  # A card/* branch never builds: its pull request is opened before the gate runs, so a deploy
  # preview would publish ungated card code. A dependabot/* branch builds no preview either: each
  # lockfile pull request would build both sites against the team's build minutes, and main builds
  # after the merge. Every other pull request still gets its preview. Otherwise skip the build only
  # when a previous successful build exists, differs, and touched nothing this site's build reads:
  # this folder and the workspace files (docs/specs/scale-launch.md).
  ignore = 'case "$HEAD" in card/*|dependabot/*) exit 0 ;; esac; test -n "$CACHED_COMMIT_REF" && test "$CACHED_COMMIT_REF" != "$COMMIT_REF" && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../../pnpm-lock.yaml ../../package.json ../../pnpm-workspace.yaml ../../tsconfig.base.json'

[build.environment]
  NODE_VERSION = "22"
  # Public values only. Secrets never go here.
  VITE_STRIPE_PAYMENT_LINK_URL = "https://buy.stripe.com/dRm28s4ie0zp6BU0qEafS01"
  VITE_DISCORD_INVITE = "https://discord.gg/rwkbWhMk8r"
  VITE_PLAY_URL = "https://peanutgallery-seed-1.netlify.app"
  VITE_SUPABASE_URL = "https://lyxndueoeisyqzewflpu.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_-i-BKWMS4TmEfSldTE9b7g_UMBRV2wh"

# The netlify.app address always forwards to the studio's own domain.
[[redirects]]
  from = "https://peanutgallerygames.netlify.app/*"
  to = "https://peanutgallery.games/:splat"
  status = 301
  force = true

# The board has its own site (docs/specs/board-site.md). /board here is a plain not found page, served
# with a 404 status, and nothing on this site names the board's address.
[[redirects]]
  from = "/board"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/board/*"
  to = "/index.html"
  status = 404
  force = true

# The Contribute, Ledger and legal pages are the app's, from kernel code (docs/specs/board-site.md).
# force serves the app at these paths even when the build holds a file there, so a page a card adds to
# public/ (ledger.html, contribute/index.html) can never stand in for one of them.
[[redirects]]
  from = "/contribute"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/ledger"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/terms"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/refunds"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/contact"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers on every path, the SPA rewrite included (docs/specs/site-truth-pass.md).
# frame-ancestors, connect-src and form-action are enforced: the page may connect only to itself and
# to the Supabase project above, over https (REST) and wss (realtime), so script on this origin cannot
# send data anywhere else (docs/specs/launch-site.md), and no form on it may post anywhere but here
# (docs/specs/board-site.md). It does not stop a same-origin call to Supabase, nor a link to another
# host: the gate's payment-host scan fails a build that carries a payment address other than the
# Payment Link above. The full policy stays report-only: the script, the stylesheet and every image
# are same-origin.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "frame-ancestors 'none'; connect-src 'self' https://lyxndueoeisyqzewflpu.supabase.co wss://lyxndueoeisyqzewflpu.supabase.co; form-action 'self'"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://lyxndueoeisyqzewflpu.supabase.co wss://lyxndueoeisyqzewflpu.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'"

# The unlisted design guide (docs/specs/design-system.md) shows sample figures, so it asks search
# engines not to index it in the response itself, not only in the meta tag the page adds once it
# runs. Netlify adds these to the headers above for this path.
[[headers]]
  for = "/design-kit-7q4m"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
