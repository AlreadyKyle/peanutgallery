[build]
  command = "pnpm --filter @backseat/site build"
  publish = "dist"
  # A card/* branch never builds: its pull request is opened before the gate runs, so a deploy
  # preview would publish ungated card code. Every other pull request still gets its preview.
  # Otherwise skip the build only when a previous successful build exists, differs, and touched
  # nothing here.
  ignore = 'case "$HEAD" in card/*) exit 0 ;; esac; test -n "$CACHED_COMMIT_REF" && test "$CACHED_COMMIT_REF" != "$COMMIT_REF" && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../../pnpm-lock.yaml ../../package.json ../../pnpm-workspace.yaml ../../tsconfig.base.json'

[build.environment]
  NODE_VERSION = "22"
  # Public values only. Secrets never go here.
  VITE_STRIPE_PAYMENT_LINK_URL = "https://buy.stripe.com/dRm28s4ie0zp6BU0qEafS01"
  VITE_DISCORD_INVITE = "https://discord.gg/rwkbWhMk8r"
  VITE_PLAY_URL = "https://peanutgallery-seed-1.netlify.app"
  VITE_SUPABASE_URL = "https://lyxndueoeisyqzewflpu.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_-i-BKWMS4TmEfSldTE9b7g_UMBRV2wh"

# The netlify.app address always forwards to the studio's own domain.
[[redirects]]
  from = "https://peanutgallerygames.netlify.app/*"
  to = "https://peanutgallery.games/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers on every path, the SPA rewrite included (docs/specs/site-truth-pass.md).
# frame-ancestors and connect-src are enforced: the page may connect only to itself and to the
# Supabase project above, over https (REST and auth) and wss (realtime), so script on this origin
# cannot send data anywhere else (docs/specs/launch-site.md). It does not stop a same-origin call to
# Supabase. The full policy stays report-only: the script, the stylesheet and every image are
# same-origin, and the /board QR code is a data: URL.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "frame-ancestors 'none'; connect-src 'self' https://lyxndueoeisyqzewflpu.supabase.co wss://lyxndueoeisyqzewflpu.supabase.co"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://lyxndueoeisyqzewflpu.supabase.co wss://lyxndueoeisyqzewflpu.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'"
