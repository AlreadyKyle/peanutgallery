[build]
  command = "pnpm --filter @backseat/seed-1 build"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../pnpm-lock.yaml ../package.json"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/config/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"
