[build]
  command = "pnpm --filter @backseat/seed-1 build"
  publish = "dist"
  # A card/* branch never builds: its pull request is opened before the gate runs, so a deploy
  # preview would publish ungated card code. A dependabot/* branch builds no preview either: each
  # lockfile pull request would build both sites against the team's build minutes, and main builds
  # after the merge. Every other pull request still gets its preview. Otherwise skip the build only
  # when a previous successful build exists, differs, and touched nothing this site's build reads:
  # this folder and the workspace files, tsconfig.base.json included, since the build typechecks
  # against it (docs/specs/scale-launch.md).
  ignore = 'case "$HEAD" in card/*|dependabot/*) exit 0 ;; esac; test -n "$CACHED_COMMIT_REF" && test "$CACHED_COMMIT_REF" != "$COMMIT_REF" && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../pnpm-lock.yaml ../package.json ../pnpm-workspace.yaml ../tsconfig.base.json'

[build.environment]
  NODE_VERSION = "22"

# Security headers on every path (the game makes no request but to its own origin: e2e/frames.spec.ts
# fails one to any other). Enforced: no framing, connections to this origin alone, no plugins, no
# <base> or form posts elsewhere. Script, style and image sources stay open: Phaser draws its own
# textures from data: and blob: URLs and the page carries one inline style block. vite.config.ts sends
# the same headers from `vite preview`, so the e2e run plays the game under them.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "frame-ancestors 'none'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/config/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"
