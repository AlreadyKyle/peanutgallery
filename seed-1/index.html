<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="build-sha" content="%BUILD_SHA%" />
    <meta name="description" content="Dust is a free idle game built by AI agents at Mob Machine. All ages." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mob Machine" />
    <meta property="og:title" content="Dust · Mob Machine" />
    <meta property="og:description" content="Dust is a free idle game built by AI agents at Mob Machine. All ages." />
    <meta property="og:url" content="https://play.mobmachine.games/" />
    <meta property="og:image" content="https://play.mobmachine.games/og-dust.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dust, a free idle game: the word Dust in thick ink block letters beside a little quarry island with a dust pile and a magenta flag, on white paper." />
    <meta property="og:image:type" content="image/png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://play.mobmachine.games/og-dust.png" />
    <meta name="twitter:image:alt" content="Dust, a free idle game: the word Dust in thick ink block letters beside a little quarry island with a dust pile and a magenta flag, on white paper." />
    <link rel="icon" type="image/svg+xml" href="./render/favicon.svg" />
    <title>Dust · Mob Machine</title>
    <!-- First paint before the game's stylesheet (render/style.css) arrives: the paper ground and ink text. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fdfcf8;
        color: #151515;
        font-family: 'Atkinson Hyperlegible Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        overflow-x: hidden;
      }
    </style>
  </head>
  <body>
    <main id="stage">
      <h1 class="visually-hidden">Dust</h1>
      <!-- The canvas is drawn for sight and pointer; the controls below are the same game as text and buttons. -->
      <div id="game" aria-hidden="true"></div>
      <p id="status" role="status">Loading the game data.</p>
      <section id="controls" class="controls" aria-label="Game controls"></section>
    </main>
    <footer>
      <div class="share-row">
        <button id="share" type="button" style="visibility: hidden">Share your run</button>
        <button id="seed-save" type="button" style="visibility: hidden">Save as seed</button>
      </div>
      <p id="share-status" role="status"></p>
      <p id="studio-line">
        <a href="https://mobmachine.games">Made by AI agents at Mob Machine</a> · All ages ·
        <a href="https://mobmachine.games/contribute">See what players are funding next</a>
      </p>
      <p id="whats-new" hidden>
        <a id="whats-new-link" href="https://mobmachine.games/contribute"></a>
      </p>
      <p id="next-card" hidden>
        <a id="next-card-link" href="https://mobmachine.games/contribute">
          <span id="next-card-title"></span>
          <span class="next-card-bar" aria-hidden="true">
            <span class="next-card-track"><span id="next-card-fill"></span></span>
            <span id="next-card-amount"></span>
          </span>
        </a>
      </p>
    </footer>
    <!-- The offer a ?seed= link opens with (render/seed-ui.ts): it never replaces a save without asking. -->
    <dialog id="seed-offer" aria-labelledby="seed-offer-title">
      <p class="seed-offer-kicker" aria-hidden="true">Seed</p>
      <h2 id="seed-offer-title"></h2>
      <p id="seed-offer-body"></p>
      <p id="seed-offer-replace" hidden></p>
      <div class="seed-offer-actions">
        <button id="seed-start" class="primary" type="button"></button>
        <button id="seed-keep" type="button"></button>
      </div>
    </dialog>
    <script type="module" src="/render/main.ts"></script>
  </body>
</html>
