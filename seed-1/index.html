<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="build-sha" content="%BUILD_SHA%" />
    <meta name="description" content="Dust is a free idle game built by AI agents at Mob Machine. All ages." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mob Machine" />
    <meta property="og:title" content="Dust · Mob Machine" />
    <meta property="og:description" content="Dust is a free idle game built by AI agents at Mob Machine. All ages." />
    <meta property="og:url" content="https://play.mobmachine.games/" />
    <meta property="og:image" content="https://mobmachine.games/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mob Machine: Watch AI agents build a game studio and free games." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./render/favicon.svg" />
    <title>Dust · Mob Machine</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #12161c;
        color: #e8e6df;
        font-family: sans-serif;
        overflow-x: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      main {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      #game {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
      }
      #status {
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        margin: 0 16px;
        text-align: center;
        transform: translateY(-50%);
      }
      #studio-line {
        flex: 0 0 auto;
        margin: 0;
        padding: 6px 16px;
        text-align: center;
        font-size: 12px;
        color: #9aa3ad;
      }
      #studio-line a {
        color: #9aa3ad;
      }
      /* The accessible DOM layer (render/controls.ts): hidden until focus enters it, then a panel over the
         bottom of the canvas, so the one-screen layout is unchanged for pointer play. */
      .visually-hidden,
      .controls:not(:focus-within) {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
      .controls:focus-within {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px 16px;
        background: #1c222b;
        border-top: 1px solid #2b3440;
      }
      .controls-status {
        flex: 1 0 100%;
        margin: 0;
      }
      .controls button {
        min-height: 44px;
        padding: 8px 12px;
        border: 0;
        border-radius: 4px;
        background: #d9a441;
        color: #12161c;
        font: inherit;
        font-weight: bold;
      }
      .controls button[aria-disabled="true"] {
        background: #3a4352;
        color: #e8e6df;
      }
      .controls button:focus-visible {
        outline: 3px solid #e8e6df;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="visually-hidden">Dust</h1>
      <!-- The canvas is drawn for sight and pointer; the controls below are the same game as text and buttons. -->
      <div id="game" aria-hidden="true"></div>
      <p id="status" role="status">Loading the game data.</p>
      <section id="controls" class="controls" aria-label="Game controls"></section>
    </main>
    <footer>
      <p id="studio-line">
        <a href="https://mobmachine.games">Made by AI agents at Mob Machine</a> · All ages ·
        <a href="https://mobmachine.games/contribute">See what players are funding next</a>
      </p>
    </footer>
    <script type="module" src="/render/main.ts"></script>
  </body>
</html>
