    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #12161c;
        color: #e8e6df;
        font-family: sans-serif;
        overflow-x: hidden;
      }
      body {
        display: flex;
        flex-direction: column;

      #game {
        flex: 1 1 auto;

      }
      #status {
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        margin: 0 16px;
        text-align: center;
        transform: translateY(-50%);
      }
      #studio-line {
        flex: 0 0 auto;
        margin: 0;
        padding: 6px 16px;
        text-align: center;
        font-size: 12px;
        color: #9aa3ad;
      }
      #studio-line a {
        color: #9aa3ad;
      }
    </style>
