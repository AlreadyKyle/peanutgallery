<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1560" width="1200" height="1560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#444"/>
    </marker>
    <style>
      .t { font-size: 15px; fill: #1a1a1a; }
      .h { font-size: 17px; font-weight: 700; fill: #1a1a1a; }
      .s { font-size: 13px; fill: #555; }
      .title { font-size: 28px; font-weight: 700; fill: #1a1a1a; }
      .lane { font-size: 13px; font-weight: 700; fill: #777; letter-spacing: 1px; }
      .box { stroke: #333; stroke-width: 1.5; }
      .in { fill: #eaf2ff; }
      .rs { fill: #fff1d6; }
      .ag { fill: #e3f5e6; }
      .st { fill: #f1e8fb; }
      .nt { fill: #f2f2f2; }
      .bad { fill: #fde6e6; }
      .line { stroke: #444; stroke-width: 1.8; fill: none; marker-end: url(#a); }
      .dash { stroke: #888; stroke-width: 1.5; fill: none; stroke-dasharray: 6 5; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="1200" height="1560" fill="#ffffff"/>

  <text x="40" y="48" class="title">Mob Machine: how a payment moves</text>
  <text x="40" y="72" class="s">Source: docs/PLAN.md §4 Funding a card, §5 Business model; docs/specs/money-logic.md; docs/specs/refunds-and-holds.md</text>
  <text x="40" y="92" class="s">All cash sits in one Stripe balance until paid out. The split below is ledger accounting in the database, not separate bank accounts.</text>

  <!-- 1 supporter -->
  <rect x="250" y="115" width="700" height="82" rx="10" class="box in"/>
  <text x="600" y="141" class="h" text-anchor="middle">1. Supporter pays on a Stripe Payment Link</text>
  <text x="600" y="162" class="t" text-anchor="middle">One-off contribution, US dollars. Dropdown picks the split (100/0 to 0/100, default 80/20)</text>
  <text x="600" y="182" class="t" text-anchor="middle">and can name a card to fund, or "Fund the next card in line"</text>

  <!-- 2 webhook -->
  <rect x="250" y="235" width="700" height="62" rx="10" class="box nt"/>
  <text x="600" y="261" class="h" text-anchor="middle">2. Stripe webhook → apply_contribution (Supabase)</text>
  <text x="600" y="282" class="t" text-anchor="middle">Split arrives in the webhook, no custom checkout. Payer = hash of card fingerprint (else email)</text>
  <path d="M600 197 V235" class="line"/>

  <!-- 3 fee -->
  <rect x="330" y="335" width="540" height="62" rx="10" class="box nt"/>
  <text x="600" y="361" class="h" text-anchor="middle">3. Stripe keeps its fee</text>
  <text x="600" y="382" class="t" text-anchor="middle">2.9% + CA$0.30, +0.8% foreign card, +2% currency conversion</text>
  <path d="M600 297 V335" class="line"/>

  <!-- 4 reserve -->
  <rect x="330" y="435" width="540" height="62" rx="10" class="box rs"/>
  <text x="600" y="461" class="h" text-anchor="middle">4. 10% chargeback reserve, off the top</text>
  <text x="600" y="482" class="t" text-anchor="middle">Mechanical, not adjustable. Absorbs disputes; kept 120 days on a wind-down</text>
  <path d="M600 397 V435" class="line"/>

  <!-- split -->
  <path d="M600 497 V535 M600 535 H300 V565 M600 535 H900 V565" class="line"/>
  <rect x="440" y="522" width="320" height="22" fill="#ffffff"/>
  <text x="600" y="538" class="s" text-anchor="middle">5. Remainder split by the supporter's choice</text>

  <!-- agents column -->
  <rect x="60" y="565" width="480" height="62" rx="10" class="box ag"/>
  <text x="300" y="591" class="h" text-anchor="middle">Agents share (compute pool)</text>
  <text x="300" y="612" class="t" text-anchor="middle">default 80%</text>

  <rect x="60" y="665" width="480" height="62" rx="10" class="box rs"/>
  <text x="300" y="691" class="h" text-anchor="middle">Incident reserve takes 5% of the Agents share</text>
  <text x="300" y="712" class="t" text-anchor="middle">until it holds $500</text>
  <path d="M300 627 V665" class="line"/>

  <rect x="60" y="765" width="480" height="104" rx="10" class="box ag"/>
  <text x="300" y="791" class="h" text-anchor="middle">Agent credit: the card-funding money</text>
  <text x="300" y="812" class="t" text-anchor="middle">Credited at once up to $50 per payer per New York day</text>
  <text x="300" y="832" class="t" text-anchor="middle">and a studio-wide daily limit (default $500, board sets it)</text>
  <text x="300" y="852" class="t" text-anchor="middle">The rest is held 14 days, released hourly</text>
  <path d="M300 727 V765" class="line"/>

  <!-- studio column -->
  <rect x="660" y="565" width="480" height="62" rx="10" class="box st"/>
  <text x="900" y="591" class="h" text-anchor="middle">Studio share</text>
  <text x="900" y="612" class="t" text-anchor="middle">default 20%</text>

  <rect x="660" y="665" width="480" height="104" rx="10" class="box st"/>
  <text x="900" y="691" class="h" text-anchor="middle">Pays the studio's own costs first</text>
  <text x="900" y="712" class="t" text-anchor="middle">Stripe fees on studio purchases, currency conversion,</text>
  <text x="900" y="732" class="t" text-anchor="middle">HST, overhead (startup probe usage, session time).</text>
  <text x="900" y="752" class="t" text-anchor="middle">Never touches the pool</text>
  <path d="M900 627 V665" class="line"/>

  <rect x="660" y="809" width="480" height="60" rx="10" class="box st"/>
  <text x="900" y="835" class="h" text-anchor="middle">What is left: studio income</text>
  <text x="900" y="855" class="t" text-anchor="middle">Set by supporters, net of the costs above</text>
  <path d="M900 769 V809" class="line"/>

  <!-- waterfall -->
  <rect x="60" y="915" width="480" height="150" rx="10" class="box ag"/>
  <text x="300" y="941" class="h" text-anchor="middle">6. One waterfall places every piece of credit</text>
  <text x="80" y="968" class="t">a. The card the payment named, up to its target</text>
  <text x="80" y="990" class="t">b. Cards that take money, in the Studio Head's rank order,</text>
  <text x="96" y="1008" class="t">each up to its target</text>
  <text x="80" y="1030" class="t">c. Whatever is left: "Not on a card yet"</text>
  <text x="80" y="1052" class="s">Every 5 minutes a sweep moves shipped or rejected cards' unspent money on</text>
  <path d="M300 869 V915" class="line"/>

  <rect x="60" y="1105" width="480" height="82" rx="10" class="box ag"/>
  <text x="300" y="1131" class="h" text-anchor="middle">7. A full bar = the pool holds the card's cost</text>
  <text x="300" y="1152" class="t" text-anchor="middle">The card moves to funded and the dispatcher can start it.</text>
  <text x="300" y="1172" class="t" text-anchor="middle">Agents run only when funded: spend is a ceiling the audience sets</text>
  <path d="M300 1065 V1105" class="line"/>

  <rect x="60" y="1227" width="480" height="104" rx="10" class="box nt"/>
  <text x="300" y="1253" class="h" text-anchor="middle">8. Agent compute is paid for</text>
  <text x="300" y="1274" class="t" text-anchor="middle">Now: sessions run on the founder's subscription,</text>
  <text x="300" y="1294" class="t" text-anchor="middle">not billed to the pool. After cutover: Managed Agents</text>
  <text x="300" y="1314" class="t" text-anchor="middle">on a separate Anthropic org, paid with paid-out money</text>
  <path d="M300 1187 V1227" class="line"/>

  <!-- payout -->
  <rect x="660" y="915" width="480" height="104" rx="10" class="box nt"/>
  <text x="900" y="941" class="h" text-anchor="middle">Stripe payout to the bank</text>
  <text x="900" y="962" class="t" text-anchor="middle">Money physically leaves Stripe only when paid out.</text>
  <text x="900" y="982" class="t" text-anchor="middle">Payouts fund the Console credit purchase and the</text>
  <text x="900" y="1002" class="t" text-anchor="middle">studio's income. Reserves stay in the Stripe balance</text>
  <path d="M900 869 V915" class="line"/>
  <path d="M660 967 H600 V1279 H540" class="dash"/>
  <rect x="560" y="1090" width="38" height="2" fill="none"/>
  <text x="590" y="1130" class="s" transform="rotate(-90 590 1130)" text-anchor="middle">buys Console credit</text>

  <!-- refunds -->
  <rect x="660" y="1105" width="480" height="226" rx="10" class="box bad"/>
  <text x="900" y="1131" class="h" text-anchor="middle">Refunds and disputes (reverse the flow)</text>
  <text x="680" y="1160" class="t">• Refund: full amount on request within 14 days,</text>
  <text x="694" y="1180" class="t">even if spent. Parent or guardian: no time limit</text>
  <text x="680" y="1204" class="t">• Reverses that payment's split and any held credit</text>
  <text x="680" y="1228" class="t">• Comes off that payment's own allocations, newest first</text>
  <text x="680" y="1252" class="t">• Stripe keeps its fee; the studio share pays it</text>
  <text x="680" y="1276" class="t">• Money already spent comes off "Not on a card yet",</text>
  <text x="694" y="1296" class="t">which can go negative. Shown and alerted, not repaid</text>
  <text x="694" y="1316" class="t">from new money</text>

  <!-- wind-down -->
  <rect x="60" y="1371" width="1080" height="82" rx="10" class="box nt"/>
  <text x="600" y="1397" class="h" text-anchor="middle">If the studio stops</text>
  <text x="600" y="1418" class="t" text-anchor="middle">Contributions close, then each contribution gets back its own unspent agent money (held credit, its share of each card bar,</text>
  <text x="600" y="1438" class="t" text-anchor="middle">its share of unassigned money). Reserves refunded after 120 days. The studio share is not refunded.</text>

  <!-- legend -->
  <g transform="translate(60 1485)">
    <rect width="18" height="18" class="box in"/><text x="26" y="14" class="s">Supporter</text>
    <rect x="130" width="18" height="18" class="box ag"/><text x="156" y="14" class="s">Agents / pool</text>
    <rect x="290" width="18" height="18" class="box st"/><text x="316" y="14" class="s">Studio</text>
    <rect x="400" width="18" height="18" class="box rs"/><text x="426" y="14" class="s">Reserves</text>
    <rect x="520" width="18" height="18" class="box nt"/><text x="546" y="14" class="s">Stripe / system</text>
    <rect x="680" width="18" height="18" class="box bad"/><text x="706" y="14" class="s">Reversal</text>
  </g>
  <text x="60" y="1535" class="s">Whether the 10% reserve is taken before or after Stripe's fee is not stated in PLAN.md §5; this chart follows the order in §4 Funding a card.</text>
</svg>
