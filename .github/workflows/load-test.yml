# The load test of the public read paths (platform/ops/load/load-test.mjs, docs/specs/load-test.md):
# - production: once after a push to main that changes the load test or this file, and by hand
#   (workflow_dispatch) with a base URL, a peak rate and a duration. Stepped to the peak (10%, 30%,
#   60% and 100% of it, each held a quarter of the duration), capped at --max-requests, and stopped
#   at once on a step's error rate over 2% or p95 over 2 s, or when more than 200 function answers
#   come from the function instead of the CDN. The tool itself refuses more than 100 requests a
#   second, 300 seconds or 10,000 requests against production. GET only, no write path.
# - local: on a pull request that changes the load test, the same tool against `vite preview` of a
#   fresh site build, so the tool is proven without production.
# Cloud sessions cannot dispatch a workflow, so they read this workflow's latest run. The verdict is
# the first line of the Load test step: PASS, FAIL or ABORTED. Read-only, no secret.
name: load-test

on:
  push:
    branches: [main]
    paths:
      - 'platform/ops/load/**'
      - '.github/workflows/load-test.yml'
  pull_request:
    paths:
      - 'platform/ops/load/**'
      - 'platform/ops/test/load.test.mjs'
      - '.github/workflows/load-test.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to load-test'
        required: false
        default: 'https://mobmachine.games'
      rate:
        description: 'Peak requests per second (production: 100 at most; one runner trips the per-address protection near 50)'
        required: false
        default: '30'
      duration:
        description: 'Seconds in all, split into four steps (production: 300 at most)'
        required: false
        default: '120'
      max_requests:
        description: 'Hard cap on requests (production: 10000 at most)'
        required: false
        default: '3000'

permissions:
  contents: read

concurrency:
  group: load-test-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  production:
    name: production
    if: github.event_name != 'pull_request' && github.repository == 'AlreadyKyle/peanutgallery'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: ${{ inputs.base_url || 'https://mobmachine.games' }}
      RATE: ${{ inputs.rate || '30' }}
      DURATION: ${{ inputs.duration || '120' }}
      MAX_REQUESTS: ${{ inputs.max_requests || '3000' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Load test
        run: |
          set -o pipefail
          node platform/ops/load/load-test.mjs "$BASE_URL" --i-mean-production \
            --rate "$RATE" --duration "$DURATION" --max-requests "$MAX_REQUESTS" \
            --json load-test.json | tee load-test.txt
      - name: Summary
        if: always()
        run: |
          if [ -f load-test.txt ]; then
            { echo '### Load test'; echo; echo '```'; cat load-test.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  local:
    name: local
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Unit tests
        run: node --test platform/ops/test/load.test.mjs
      - name: Build the site
        run: pnpm --filter @backseat/site build
      - name: Load test against vite preview
        run: |
          set -o pipefail
          cd platform/site
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4431 --strictPort > ../../preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:4431/ && break; sleep 1; done
          cd ../..
          node platform/ops/load/load-test.mjs http://127.0.0.1:4431 --profile static --rate 50 --duration 20 \
            --json load-test.json | tee load-test.txt
      - name: Summary
        if: always()
        run: |
          if [ -f load-test.txt ]; then
            { echo '### Load test (local)'; echo; echo '```'; cat load-test.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
