name: gate

on:
  pull_request:
  push:
    branches: [main]

# Card code runs in these jobs. The token reads the repository and nothing more, no step names a
# secret, and no checkout leaves the token in .git/config (docs/specs/launch-gate.md).
permissions:
  contents: read

# A newer push to a pull request cancels its older run: the dispatcher reads the gate only at the
# exact head sha. A push to main keeps one group per sha and is never cancelled.
#
# Actions minutes (docs/specs/scale-launch.md): detect selects only the jobs and slow steps a change
# can affect (platform/gate/changed-paths.sh), the jobs that run card tests cache the pnpm store,
# and the gate job fails unless every job detect selected passed.
concurrency:
  group: gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      seed: ${{ steps.paths.outputs.seed }}
      platform: ${{ steps.paths.outputs.platform }}
      lane: ${{ steps.paths.outputs.lane }}
      site: ${{ steps.paths.outputs.site }}
      functions: ${{ steps.paths.outputs.functions }}
      render: ${{ steps.paths.outputs.render }}
      base: ${{ steps.refs.outputs.base }}
      head: ${{ steps.refs.outputs.head }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the compared commits
        id: refs
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ -n "$PR_HEAD" ]; then
            echo "base=$PR_BASE" >> "$GITHUB_OUTPUT"
            echo "head=$PR_HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "base=$PUSH_BASE" >> "$GITHUB_OUTPUT"
            echo "head=$PUSH_HEAD" >> "$GITHUB_OUTPUT"
          fi
      # The kernel checks run here, before any job installs dependencies or runs card code: an install
      # runs lifecycle scripts and reads .npmrc and .pnpmfile.cjs, and card tests run anything. A
      # failure here skips every other job, and the gate job fails on it.
      - name: Use the base commit's gate on a card branch
        if: startsWith(github.head_ref, 'card/')
        env:
          BASE: ${{ steps.refs.outputs.base }}
        run: git checkout "$BASE" -- platform/gate
      - name: Write the commit message and changed files
        env:
          BASE: ${{ steps.refs.outputs.base }}
          HEAD: ${{ steps.refs.outputs.head }}
        run: |
          git log -1 --format=%B "$HEAD" > "$RUNNER_TEMP/commit-message.txt"
          bash platform/gate/changed-paths.sh --list "$BASE" "$HEAD" > "$RUNNER_TEMP/changed-files.txt"
      - name: Kernel guard on a card branch
        if: startsWith(github.head_ref, 'card/')
        run: bash platform/gate/kernel-guard.sh "$RUNNER_TEMP/changed-files.txt"
      - name: Refuse symlinks and submodules on a card branch
        if: startsWith(github.head_ref, 'card/')
        env:
          BASE: ${{ steps.refs.outputs.base }}
          HEAD: ${{ steps.refs.outputs.head }}
        run: bash platform/gate/changed-paths.sh --check-modes "$BASE" "$HEAD"
      - name: Keep a card branch inside its lane
        if: startsWith(github.head_ref, 'card/')
        env:
          BASE: ${{ steps.refs.outputs.base }}
          HEAD: ${{ steps.refs.outputs.head }}
          BRANCH: ${{ github.head_ref }}
        run: bash platform/gate/changed-paths.sh --check-lane "$BRANCH" "$BASE" "$HEAD"
      - name: Detect folders and lane
        id: paths
        env:
          BASE: ${{ steps.refs.outputs.base }}
          HEAD: ${{ steps.refs.outputs.head }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          result=$(bash platform/gate/changed-paths.sh "$BASE" "$HEAD")
          echo "$result"
          seed=$(echo "$result" | sed -E 's/.*seed=([a-z]+).*/\1/')
          platform=$(echo "$result" | sed -E 's/.*platform=([a-z]+).*/\1/')
          lane=$(echo "$result" | sed -E 's/.*lane=([a-z]+).*/\1/')
          site=$(echo "$result" | sed -E 's/.*site=([a-z]+).*/\1/')
          functions=$(echo "$result" | sed -E 's/.*functions=([a-z]+).*/\1/')
          render=$(echo "$result" | sed -E 's/.*render=([a-z]+).*/\1/')
          case "$BRANCH" in
            *-code) lane=code ;;
          esac
          # A flag that is not exactly true or false would skip a job, so it fails the gate instead.
          for flag in "seed=$seed" "platform=$platform" "site=$site" "functions=$functions" "render=$render"; do
            case "${flag#*=}" in
              true|false) ;;
              *) echo "detect: malformed flag $flag in: $result"; exit 1 ;;
            esac
          done
          case "$lane" in
            config|code) ;;
            *) echo "detect: malformed lane $lane in: $result"; exit 1 ;;
          esac
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "functions=$functions" >> "$GITHUB_OUTPUT"
          echo "render=$render" >> "$GITHUB_OUTPUT"
          echo "seed=$seed platform=$platform lane=$lane site=$site functions=$functions render=$render branch=$BRANCH"
      # The secret scan, the deny-list and the runtime-token scan read the change as committed, with
      # no install and no card code run.
      - name: Scan the change before any card code runs
        env:
          SEED: ${{ steps.paths.outputs.seed }}
          PLATFORM: ${{ steps.paths.outputs.platform }}
          LANE: ${{ steps.paths.outputs.lane }}
        run: |
          if [ "$SEED" = true ]; then
            bash platform/gate/ship-gate.sh --phase scans --folder seed-1 --lane "$LANE" --commit-message-file "$RUNNER_TEMP/commit-message.txt" --changed-files-file "$RUNNER_TEMP/changed-files.txt"
          fi
          if [ "$PLATFORM" = true ]; then
            bash platform/gate/ship-gate.sh --phase scans --folder platform --commit-message-file "$RUNNER_TEMP/commit-message.txt" --changed-files-file "$RUNNER_TEMP/changed-files.txt"
          fi

  seed-code:
    name: seed-code
    needs: detect
    if: needs.detect.outputs.seed == 'true' && needs.detect.outputs.lane == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # On a card branch every gate script runs from the base commit, so a card cannot change the
      # checks it is held to.
      - name: Use the base commit's gate on a card branch
        if: startsWith(github.head_ref, 'card/')
        env:
          BASE: ${{ needs.detect.outputs.base }}
        run: git checkout "$BASE" -- platform/gate
      - name: Typecheck and tests
        run: bash platform/gate/ship-gate.sh --phase checks --folder seed-1 --lane code

  platform:
    name: platform
    needs: detect
    if: needs.detect.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # On a card branch every gate script runs from the base commit, so a card cannot change the
      # checks it is held to.
      - name: Use the base commit's gate on a card branch
        if: startsWith(github.head_ref, 'card/')
        env:
          BASE: ${{ needs.detect.outputs.base }}
        run: git checkout "$BASE" -- platform/gate
      - name: Typecheck and tests
        run: bash platform/gate/ship-gate.sh --phase checks --folder platform
      # The rest of pnpm verify: the checks phase runs the dispatcher, supabase and site tests only.
      - name: Gate tests
        run: pnpm --filter @backseat/gate test
      # The eval rule compares the change with the commit detect compared (docs/specs/agent-upkeep.md).
      - name: Agent role spec tests
        env:
          EVAL_BASE: ${{ needs.detect.outputs.base }}
        run: pnpm test:agents
      - name: Ops tests
        run: pnpm test:ops
      - name: Docs tests
        run: pnpm test:docs
      # The Deno tests read only platform/supabase, so detect selects them only for a change that can
      # reach it.
      - uses: denoland/setup-deno@v2
        if: needs.detect.outputs.functions == 'true'
        with:
          deno-version: v2.7.13
      - name: Stripe webhook function tests
        if: needs.detect.outputs.functions == 'true'
        run: pnpm test:functions

  # The end-to-end suites, on their own runner beside the platform job so neither waits on the other
  # (docs/specs/gate-e2e-job.md). Detect selects them only for a change that can reach the site or the
  # role specs it reads. They run card code, like the platform job, so they install the same way and
  # run the base commit's gate on a card branch.
  end-to-end:
    name: end-to-end
    needs: detect
    if: needs.detect.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use the base commit's gate on a card branch
        if: startsWith(github.head_ref, 'card/')
        env:
          BASE: ${{ needs.detect.outputs.base }}
        run: git checkout "$BASE" -- platform/gate
      # The suite serves a build. This one is only for the suite: the build job builds and scans the
      # site on its own runner.
      - name: Build the site for the end-to-end suite
        run: pnpm --filter @backseat/site build
      - name: Install Chromium for Playwright
        run: pnpm --filter @backseat/site exec playwright install --with-deps chromium
      - name: Site end-to-end
        run: pnpm --filter @backseat/site e2e
      # The board's own site (docs/specs/board-site.md) builds its own copy for its suite, under its
      # enforced policy, with the Chromium installed above.
      - name: Board site end-to-end
        run: pnpm --filter @backseat/board e2e

  # A fresh runner that never runs card tests builds each selected folder and scans the build, and
  # only then runs the headless bot, the one step here that runs card code. On a card branch every
  # kernel file (the gate, the package files, the build configs, the bot harness) comes from the base
  # commit first, and the install runs no lifecycle scripts. There is no dependency cache: a cache
  # can be written by a run that ran card tests. The bot still imports the card's sim code, so it
  # catches a confused agent's regressions; it is not containment against a malicious one.
  build:
    name: build
    needs: detect
    if: needs.detect.outputs.seed == 'true' || needs.detect.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore every kernel file from the base commit on a card branch
        if: startsWith(github.head_ref, 'card/')
        env:
          BASE: ${{ needs.detect.outputs.base }}
        run: |
          git checkout "$BASE" -- platform/gate
          bash platform/gate/restore-kernel.sh "$BASE"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build seed-1 and scan the build
        if: needs.detect.outputs.seed == 'true'
        env:
          LANE: ${{ needs.detect.outputs.lane }}
        run: bash platform/gate/ship-gate.sh --phase build --folder seed-1 --lane "$LANE"
      - name: Build the sites and scan the builds
        if: needs.detect.outputs.site == 'true'
        run: bash platform/gate/ship-gate.sh --phase build --folder platform
      - name: Headless bot
        if: needs.detect.outputs.seed == 'true'
        env:
          LANE: ${{ needs.detect.outputs.lane }}
        run: bash platform/gate/ship-gate.sh --phase bot --folder seed-1 --lane "$LANE"

  # What a change draws (docs/specs/design-review.md). A fresh runner that runs no card code in Node
  # restores every kernel file from the base commit on a card branch, as the build job does, installs
  # without lifecycle scripts, and runs the kernel screenshot specs twice: on the change, and on a
  # worktree of the base (a side whose spec the base does not have yet is skipped there). The card's
  # code runs only in the browser: the specs, their configs and every file they import are kernel, and
  # the game's states are made from the base's sim. The site's frames are every route in
  # platform/site/e2e/routes.ts at 375, 768 and 1440 on the e2e fixture; the game's are the canvas at
  # four fixed states and the page at 375. frames-diff.sh, copied out before the draws, keeps each
  # frame that differs from the base's, as a before and after pair with changed.txt, and they are
  # uploaded as the design-frames artifact for a day: the dispatcher's visual review reads it. There is
  # no dependency cache: a cache can be written by a run that ran card tests.
  frames:
    name: frames
    needs: detect
    if: needs.detect.outputs.render == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore every kernel file from the base commit on a card branch
        if: startsWith(github.head_ref, 'card/')
        env:
          BASE: ${{ needs.detect.outputs.base }}
        run: |
          git checkout "$BASE" -- platform/gate
          bash platform/gate/restore-kernel.sh "$BASE"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium for Playwright
        run: pnpm --filter @backseat/site exec playwright install --with-deps chromium
      - name: Make the game's states from the base before any of the change's code runs
        env:
          BASE: ${{ needs.detect.outputs.base }}
          SEED: ${{ needs.detect.outputs.seed }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # The draws below run the kernel specs in Node, which import only kernel files
          # (platform/dispatcher/test/frames-kernel.test.ts). The game's states come from the sim, which
          # a card can change, so frame-states.ts runs on the base commit's worktree and the change's
          # draw only reads the file (E2E_FRAME_STATES). frames-diff.sh is copied out first, so the
          # frames are kept by the script the job started with.
          mkdir -p "$RUNNER_TEMP/gate"
          cp platform/gate/frames-diff.sh "$RUNNER_TEMP/gate/frames-diff.sh"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          (cd "$RUNNER_TEMP/base" && pnpm install --frozen-lockfile --ignore-scripts)
          if [ "$SEED" = true ] && [ -f seed-1/e2e/frames.spec.ts ]; then
            if [ -f "$RUNNER_TEMP/base/seed-1/e2e/frame-states.ts" ]; then
              (cd "$RUNNER_TEMP/base" && pnpm --filter @backseat/seed-1 exec tsx e2e/frame-states.ts "$RUNNER_TEMP/frame-states.json")
            else
              # Only a board branch that adds the frame spec gets here: a card branch's kernel restore
              # removes a frame spec its base does not have.
              case "$HEAD_REF" in card/*) echo "the base has no frame states for a card branch"; exit 1 ;; esac
              pnpm --filter @backseat/seed-1 exec tsx e2e/frame-states.ts "$RUNNER_TEMP/frame-states.json"
            fi
          fi
      - name: Draw the change and the base
        env:
          SITE: ${{ needs.detect.outputs.site }}
          SEED: ${{ needs.detect.outputs.seed }}
        run: |
          # draw <checkout> <frames folder>: the site's routes when detect selected the site, the
          # game's states when it selected the seed, each only where the checkout has the spec. The
          # game's draw runs Playwright itself, not the e2e script, which would make the states from
          # the checkout's own sim.
          draw() {
            if [ "$SITE" = true ] && [ -f "$1/platform/site/e2e/route-shots.spec.ts" ]; then
              (cd "$1" && E2E_ROUTE_SHOTS="$2/site" pnpm --filter @backseat/site exec playwright test e2e/route-shots.spec.ts)
            fi
            if [ "$SEED" = true ] && [ -f "$1/seed-1/e2e/frames.spec.ts" ]; then
              (cd "$1" && E2E_FRAMES="$2/game" E2E_FRAME_STATES="$RUNNER_TEMP/frame-states.json" pnpm --filter @backseat/seed-1 exec playwright test)
            fi
          }
          draw "$GITHUB_WORKSPACE" "$RUNNER_TEMP/after"
          draw "$RUNNER_TEMP/base" "$RUNNER_TEMP/before"
      - name: Keep the frames that differ from the base
        run: |
          for side in site game; do
            if [ -d "$RUNNER_TEMP/after/$side" ]; then
              bash "$RUNNER_TEMP/gate/frames-diff.sh" "$RUNNER_TEMP/before/$side" "$RUNNER_TEMP/after/$side" "$RUNNER_TEMP/upload/$side"
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: design-frames
          path: ${{ runner.temp }}/upload
          retention-days: 1
          if-no-files-found: error

  gate:
    name: gate
    needs: [detect, seed-code, platform, end-to-end, build, frames]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A skipped job passes only when detect ran and did not select it: a failed detect skips every
      # other job, so detect's own result and each selected job's result are checked by name. A flag
      # that is not exactly true or false fails, so a missing output never reads as "not selected".
      - name: Require detect and every job it selected to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          DETECT: ${{ needs.detect.result }}
          SEED: ${{ needs.detect.outputs.seed }}
          PLATFORM: ${{ needs.detect.outputs.platform }}
          SITE: ${{ needs.detect.outputs.site }}
          FUNCTIONS: ${{ needs.detect.outputs.functions }}
          RENDER: ${{ needs.detect.outputs.render }}
          LANE: ${{ needs.detect.outputs.lane }}
          SEED_CODE: ${{ needs.seed-code.result }}
          PLATFORM_JOB: ${{ needs.platform.result }}
          E2E_JOB: ${{ needs.end-to-end.result }}
          BUILD: ${{ needs.build.result }}
          FRAMES: ${{ needs.frames.result }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "a needed job failed or was cancelled"
            exit 1
          fi
          [ "$DETECT" = success ] || { echo "detect did not pass: $DETECT"; exit 1; }
          for flag in "seed=$SEED" "platform=$PLATFORM" "site=$SITE" "functions=$FUNCTIONS" "render=$RENDER"; do
            case "${flag#*=}" in
              true|false) ;;
              *) echo "detect gave a malformed flag: $flag"; exit 1 ;;
            esac
          done
          want() {
            [ "$2" = success ] || { echo "detect selected $1 and it did not pass: $2"; exit 1; }
          }
          if [ "$SEED" = true ] && [ "$LANE" = code ]; then want seed-code "$SEED_CODE"; fi
          if [ "$PLATFORM" = true ] || [ "$SITE" = true ] || [ "$FUNCTIONS" = true ]; then want platform "$PLATFORM_JOB"; fi
          if [ "$SITE" = true ]; then
            want end-to-end "$E2E_JOB"
          else
            [ "$E2E_JOB" = skipped ] || { echo "detect did not select end-to-end and it ran: $E2E_JOB"; exit 1; }
          fi
          if [ "$SEED" = true ] || [ "$SITE" = true ]; then want build "$BUILD"; fi
          if [ "$RENDER" = true ]; then
            want frames "$FRAMES"
          else
            [ "$FRAMES" = skipped ] || { echo "detect did not select frames and it ran: $FRAMES"; exit 1; }
          fi
          echo "gate passed"
