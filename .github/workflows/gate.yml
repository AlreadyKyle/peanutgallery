name: gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      seed: ${{ steps.paths.outputs.seed }}
      platform: ${{ steps.paths.outputs.platform }}
      lane: ${{ steps.paths.outputs.lane }}
      base: ${{ steps.refs.outputs.base }}
      head: ${{ steps.refs.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the compared commits
        id: refs
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ -n "$PR_HEAD" ]; then
            echo "base=$PR_BASE" >> "$GITHUB_OUTPUT"
            echo "head=$PR_HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "base=$PUSH_BASE" >> "$GITHUB_OUTPUT"
            echo "head=$PUSH_HEAD" >> "$GITHUB_OUTPUT"
          fi
      # The card checks run here, before any job installs dependencies: an install runs lifecycle
      # scripts and reads .npmrc and .pnpmfile.cjs, so a card could run code before a later guard.
      # A failure here skips every other job, and the gate job fails on it.
      - name: Use the base commit's gate on a card branch
        if: startsWith(github.head_ref, 'card/')
        env:
          BASE: ${{ steps.refs.outputs.base }}
        run: git checkout "$BASE" -- platform/gate
      - name: List the changed files on a card branch
        if: startsWith(github.head_ref, 'card/')
        env:
          BASE: ${{ steps.refs.outputs.base }}
          HEAD: ${{ steps.refs.outputs.head }}
        run: bash platform/gate/changed-paths.sh --list "$BASE" "$HEAD" > "$RUNNER_TEMP/changed-files.txt"
      - name: Kernel guard on a card branch
        if: startsWith(github.head_ref, 'card/')
        run: bash platform/gate/kernel-guard.sh "$RUNNER_TEMP/changed-files.txt"
      - name: Refuse symlinks and submodules on a card branch
        if: startsWith(github.head_ref, 'card/')
        env:
          BASE: ${{ steps.refs.outputs.base }}
          HEAD: ${{ steps.refs.outputs.head }}
        run: bash platform/gate/changed-paths.sh --check-modes "$BASE" "$HEAD"
      - name: Detect folders and lane
        id: paths
        env:
          BASE: ${{ steps.refs.outputs.base }}
          HEAD: ${{ steps.refs.outputs.head }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          result=$(bash platform/gate/changed-paths.sh "$BASE" "$HEAD")
          echo "$result"
          seed=$(echo "$result" | sed -E 's/.*seed=([a-z]+).*/\1/')
          platform=$(echo "$result" | sed -E 's/.*platform=([a-z]+).*/\1/')
          lane=$(echo "$result" | sed -E 's/.*lane=([a-z]+).*/\1/')
          case "$BRANCH" in
            *-code) lane=code ;;
            *-config) [ "$lane" = config ] || echo "branch name says config but the change touches code; lane stays code" ;;
          esac
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "seed=$seed platform=$platform lane=$lane branch=$BRANCH"

  seed-config:
    name: seed-config
    needs: detect
    if: needs.detect.outputs.seed == 'true' && needs.detect.outputs.lane == 'config'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # On a card branch every gate script, changed-paths.sh included, runs from the base commit,
      # so a card cannot change the list it is checked against.
      - name: Use the base commit's gate on a card branch
        if: startsWith(github.head_ref, 'card/')
        env:
          BASE: ${{ needs.detect.outputs.base }}
        run: git checkout "$BASE" -- platform/gate
      - name: Write the commit message and changed files
        env:
          BASE: ${{ needs.detect.outputs.base }}
          HEAD: ${{ needs.detect.outputs.head }}
        run: |
          git log -1 --format=%B "$HEAD" > "$RUNNER_TEMP/commit-message.txt"
          bash platform/gate/changed-paths.sh --list "$BASE" "$HEAD" > "$RUNNER_TEMP/changed-files.txt"
      - name: Ship gate
        run: bash platform/gate/ship-gate.sh --folder seed-1 --lane config --commit-message-file "$RUNNER_TEMP/commit-message.txt" --changed-files-file "$RUNNER_TEMP/changed-files.txt"

  seed-code:
    name: seed-code
    needs: detect
    if: needs.detect.outputs.seed == 'true' && needs.detect.outputs.lane == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # On a card branch every gate script, changed-paths.sh included, runs from the base commit,
      # so a card cannot change the list it is checked against.
      - name: Use the base commit's gate on a card branch
        if: startsWith(github.head_ref, 'card/')
        env:
          BASE: ${{ needs.detect.outputs.base }}
        run: git checkout "$BASE" -- platform/gate
      - name: Write the commit message and changed files
        env:
          BASE: ${{ needs.detect.outputs.base }}
          HEAD: ${{ needs.detect.outputs.head }}
        run: |
          git log -1 --format=%B "$HEAD" > "$RUNNER_TEMP/commit-message.txt"
          bash platform/gate/changed-paths.sh --list "$BASE" "$HEAD" > "$RUNNER_TEMP/changed-files.txt"
      - name: Ship gate
        run: bash platform/gate/ship-gate.sh --folder seed-1 --lane code --commit-message-file "$RUNNER_TEMP/commit-message.txt" --changed-files-file "$RUNNER_TEMP/changed-files.txt"

  platform:
    name: platform
    needs: detect
    if: needs.detect.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # On a card branch every gate script, changed-paths.sh included, runs from the base commit,
      # so a card cannot change the list it is checked against.
      - name: Use the base commit's gate on a card branch
        if: startsWith(github.head_ref, 'card/')
        env:
          BASE: ${{ needs.detect.outputs.base }}
        run: git checkout "$BASE" -- platform/gate
      - name: Write the commit message and changed files
        env:
          BASE: ${{ needs.detect.outputs.base }}
          HEAD: ${{ needs.detect.outputs.head }}
        run: |
          git log -1 --format=%B "$HEAD" > "$RUNNER_TEMP/commit-message.txt"
          bash platform/gate/changed-paths.sh --list "$BASE" "$HEAD" > "$RUNNER_TEMP/changed-files.txt"
      - name: Ship gate
        run: bash platform/gate/ship-gate.sh --folder platform --lane code --commit-message-file "$RUNNER_TEMP/commit-message.txt" --changed-files-file "$RUNNER_TEMP/changed-files.txt"
      # The rest of pnpm verify: the ship gate runs the dispatcher, supabase and site tests only.
      - name: Gate tests
        run: pnpm --filter @backseat/gate test
      - name: Agent role spec tests
        run: pnpm test:agents
      - name: Ops tests
        run: pnpm test:ops
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.13
      - name: Stripe webhook function tests
        run: pnpm test:functions
      - name: Install Chromium for Playwright
        run: pnpm --filter @backseat/site exec playwright install --with-deps chromium
      - name: Site end-to-end
        run: pnpm --filter @backseat/site e2e

  gate:
    name: gate
    needs: [detect, seed-config, seed-code, platform]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A skipped job passes only when detect ran and did not select it: a failed detect skips every
      # other job, so detect's own result and each selected job's result are checked by name.
      - name: Require detect and every job it selected to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          DETECT: ${{ needs.detect.result }}
          SEED: ${{ needs.detect.outputs.seed }}
          PLATFORM: ${{ needs.detect.outputs.platform }}
          LANE: ${{ needs.detect.outputs.lane }}
          SEED_CONFIG: ${{ needs.seed-config.result }}
          SEED_CODE: ${{ needs.seed-code.result }}
          PLATFORM_JOB: ${{ needs.platform.result }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "a needed job failed or was cancelled"
            exit 1
          fi
          [ "$DETECT" = success ] || { echo "detect did not pass: $DETECT"; exit 1; }
          want() {
            [ "$2" = success ] || { echo "detect selected $1 and it did not pass: $2"; exit 1; }
          }
          if [ "$SEED" = true ] && [ "$LANE" = config ]; then want seed-config "$SEED_CONFIG"; fi
          if [ "$SEED" = true ] && [ "$LANE" = code ]; then want seed-code "$SEED_CODE"; fi
          if [ "$PLATFORM" = true ]; then want platform "$PLATFORM_JOB"; fi
          echo "gate passed"
