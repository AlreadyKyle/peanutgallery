# Mob Machine's daily jobs (docs/specs/actions-host.md, docs/PLAN.md §10 decision 78): the nightly
# backup, the Controller, the quota check and the ship notices, on GitHub-hosted runners, free in this
# public repository, and the marketing engine every hour (docs/specs/marketing-engine.md, PLAN.md §10
# decision 77), which posts the studio's news to Bluesky, Mastodon and Discord and reads nothing back.
# The first four ran in the board's private repository AlreadyKyle/mobmachine-ops from 6 October
# 2026 until the account's free private minutes ran out on 18 October 2026.
#
# Secrets: the job runs in the GitHub environment `ops`, whose deployment branch policy allows main
# alone, so a card branch, a pull request or a fork never receives a job's env. Only the step that runs
# the job reads a secret, and only that job's own (BACKUP_ENV, CONTROLLER_ENV, QUOTA_ENV,
# NOTICES_ENV or MARKETING_ENV); the alert step reads NTFY_TOPIC_URL. The job code is this run's own commit of main, as
# for the dispatcher: the kernel paths (.github, platform/ops) keep card code from changing what runs.
# The repository is public, and so are its Actions logs: the job's output goes to a file that is
# encrypted with age to vars.BACKUP_AGE_RECIPIENT and kept as an artifact for 14 days, and the public
# log shows only the job, its exit and its PASS or FAIL (platform/ops/actions/run-ops-job.sh). The
# backup is the same .tar.age as before, encrypted to the same key before it leaves the job.
# The backup is also copied off GitHub, to the Google Cloud Storage bucket gs://mobmachine-backups, by
# the job `offsite`: it runs after a backup alone, reads no job secret, and is the only job that may ask
# GitHub for an OIDC token (id-token: write). Google's Workload Identity Federation trades that token
# for the service account backup-writer, which may create objects in the bucket and nothing else: it
# cannot read, list, overwrite or delete one (platform/ops/README.md, Backups off GitHub).
# Every action is pinned to a full commit sha (the tag it was is in the comment).
name: ops-jobs

on:
  schedule:
    - cron: '17 6 * * *'   # backup
    - cron: '7 7 * * *'    # controller
    - cron: '37 7 * * *'   # quota
    - cron: '7 9 * * *'    # notices
    - cron: '23 * * * *'   # marketing
  workflow_dispatch:
    inputs:
      job:
        description: backup, controller, quota, notices or marketing
        required: true
        type: choice
        options: [backup, controller, quota, notices, marketing]

permissions:
  contents: read

jobs:
  run:
    name: ops job
    if: github.ref == 'refs/heads/main' && github.repository == 'AlreadyKyle/peanutgallery'
    runs-on: ubuntu-24.04
    environment: ops
    timeout-minutes: 30
    concurrency:
      group: ops-job-${{ github.event.inputs.job || github.event.schedule }}
      cancel-in-progress: false
    outputs:
      job: ${{ steps.pick.outputs.job }}
    steps:
      - name: Pick the job
        id: pick
        env:
          ASKED: ${{ github.event.inputs.job }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          case "$ASKED:$SCHEDULE" in
            backup:* | ':17 6 * * *') job=backup ;;
            controller:* | ':7 7 * * *') job=controller ;;
            quota:* | ':37 7 * * *') job=quota ;;
            notices:* | ':7 9 * * *') job=notices ;;
            marketing:* | ':23 * * * *') job=marketing ;;
            *) echo "no job for '$ASKED' '$SCHEDULE'"; exit 1 ;;
          esac
          echo "job=$job" >> "$GITHUB_OUTPUT"
          echo "job: $job"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            platform/ops
            platform/supabase/functions/_shared
            platform/site
            platform/gate

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Install age, and the PostgreSQL 17 client for the backup
        env:
          JOB: ${{ steps.pick.outputs.job }}
        run: |
          set -euo pipefail
          if [ "$JOB" = backup ]; then
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
            sudo apt-get install -y -q --no-install-recommends postgresql-client-17 age > /dev/null
            /usr/lib/postgresql/17/bin/pg_dump --version
          else
            sudo apt-get install -y -q --no-install-recommends age > /dev/null
          fi

      - name: Run the job
        env:
          JOB: ${{ steps.pick.outputs.job }}
          JOB_ENV: ${{ (steps.pick.outputs.job == 'backup' && secrets.BACKUP_ENV) || (steps.pick.outputs.job == 'controller' && secrets.CONTROLLER_ENV) || (steps.pick.outputs.job == 'quota' && secrets.QUOTA_ENV) || (steps.pick.outputs.job == 'notices' && secrets.NOTICES_ENV) || (steps.pick.outputs.job == 'marketing' && secrets.MARKETING_ENV) || '' }}
        run: bash platform/ops/actions/run-ops-job.sh "$JOB"

      - name: Encrypt the job's log
        id: log
        if: always()
        env:
          AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/ops-job/job.log"
          if [ ! -f "$log" ]; then echo "no job log"; exit 0; fi
          if [ -z "$AGE_RECIPIENT" ]; then
            rm -f "$log"
            echo "vars.BACKUP_AGE_RECIPIENT is not set; the log was deleted, not uploaded"
            exit 1
          fi
          age -r "$AGE_RECIPIENT" -o "$RUNNER_TEMP/ops-job-log.age" "$log"
          rm -f "$log"
          echo "encrypted=true" >> "$GITHUB_OUTPUT"

      - name: Keep the encrypted log
        if: always() && steps.log.outputs.encrypted == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ops-log-${{ steps.pick.outputs.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ops-job-log.age
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Keep the encrypted backup
        if: steps.pick.outputs.job == 'backup'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backup-${{ github.run_id }}
          path: ${{ runner.temp }}/ops-job/backups/*.tar.age
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Alert the board
        if: failure()
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          JOB: ${{ steps.pick.outputs.job }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$NTFY_TOPIC_URL" ]; then echo "no NTFY_TOPIC_URL; the alert was not sent"; exit 0; fi
          curl -fsS --max-time 20 -H 'Title: Mob Machine job' \
            -d "Mob Machine job ${JOB:-unknown} failed on GitHub Actions: $RUN_URL" "$NTFY_TOPIC_URL" > /dev/null || true

      - name: Remove the env files
        if: always()
        run: rm -rf "$RUNNER_TEMP/ops-job/env"

  offsite:
    name: backup off GitHub
    needs: run
    if: needs.run.outputs.job == 'backup'
    runs-on: ubuntu-24.04
    environment: ops
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backup-${{ github.run_id }}
          path: ${{ runner.temp }}/backup

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/1072097120782/locations/global/workloadIdentityPools/github/providers/peanutgallery
          service_account: backup-writer@mob-machine.iam.gserviceaccount.com

      - name: Copy the encrypted backup to the bucket
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/backup/*.tar.age)
          if [ "${#files[@]}" -ne 1 ]; then echo "expected one .tar.age, found ${#files[@]}"; exit 1; fi
          name=$(basename "${files[0]}")
          # One JSON API create, ifGenerationMatch=0 so an existing name is refused: gcloud storage cp
          # reads the object first, which backup-writer may not do.
          token=$(gcloud auth print-access-token)
          echo "::add-mask::$token"
          curl -fsS --max-time 600 -o /dev/null -H @<(printf 'Authorization: Bearer %s\n' "$token") \
            -H 'Content-Type: application/octet-stream' --data-binary @"${files[0]}" \
            "https://storage.googleapis.com/upload/storage/v1/b/mobmachine-backups/o?uploadType=media&ifGenerationMatch=0&name=$name"
          echo "offsite: gs://mobmachine-backups/$name"

      - name: Send the failure alert
        if: failure()
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$NTFY_TOPIC_URL" ]; then echo "no NTFY_TOPIC_URL; the alert was not sent"; exit 0; fi
          curl -fsS --max-time 20 -H 'Title: Mob Machine job' \
            -d "Mob Machine job backup failed to reach the bucket on GitHub Actions: $RUN_URL" "$NTFY_TOPIC_URL" > /dev/null || true
